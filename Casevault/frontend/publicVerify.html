<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NDIS | Public Verification Portal</title>
  
  <!-- Shared Styles -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/gov-theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">

  <style>
    body {
      background-color: #F8FAFC;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    .verify-header {
      background-color: var(--gov-navy-dark);
      color: white;
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .verify-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .verify-card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
      padding: 40px;
    }
  </style>
</head>
<body>

  <header class="verify-header">
    <div style="display: flex; align-items: center; gap: 15px;">
      <div style="font-size: 28px;">🏛</div>
      <div>
        <div style="font-weight: 800; letter-spacing: 1px;">NATIONAL DIGITAL INVESTIGATION SERVICES</div>
        <div style="font-size: 12px; color: #94A3B8;">Government of India • Zero-Knowledge Verification Portal</div>
      </div>
    </div>
    <div style="font-size: 13px;">
      <a href="index.html" style="color: white; text-decoration: none;">← Officer Login</a>
    </div>
  </header>

  <main class="verify-container">
    <div class="verify-card" id="verify-app-root">
      <!-- Injected by verifyPortal.js -->
    </div>
  </main>

  <footer style="text-align: center; padding: 20px; font-size: 12px; color: var(--gov-text-muted);">
    Powered by NDIS Blockchain Architecture. In compliance with Bharatiya Sakshya Adhiniyam, 2023 (Sec 65B).
  </footer>

  <script src="js/views/verifyPortal.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      VerifyPortal.init('verify-app-root');
    });
  </script>
</body>
</html>
