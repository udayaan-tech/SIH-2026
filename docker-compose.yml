version: '3.8'

services:
  # ═══════════════════════════════════════════════
  # 1. PostgreSQL — Relational Database
  # Stores users, cases, metadata, WORM audit log
  # ═══════════════════════════════════════════════
  postgres:
    image: postgres:15-alpine
    container_name: nyay_suraksha_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: nyay_suraksha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ═══════════════════════════════════════════════
  # 2. Redis — In-Memory Cache
  # Handles JWT blacklisting and OTP sessions
  # ═══════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: nyay_suraksha_cache
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # ═══════════════════════════════════════════════
  # 3. MinIO — S3-Compatible Object Storage
  # Stores the actual encrypted evidence files
  # ═══════════════════════════════════════════════
  minio:
    image: minio/minio:latest
    container_name: nyay_suraksha_storage
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web UI Console
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # ═══════════════════════════════════════════════
  # 4. MinIO Setup — Auto-create bucket
  # ═══════════════════════════════════════════════
  minio-setup:
    image: minio/mc
    container_name: nyay_suraksha_storage_setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc config host add myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/evidence-vault --ignore-existing;
      /usr/bin/mc policy set public myminio/evidence-vault;
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:
